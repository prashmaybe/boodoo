name: CI

permissions:
  contents: read

on:
  push:
    branches: ['main', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint source files
        run: npm run lint

      - name: Verify code formatting
        run: npm run format

      - name: Build framework (CSS + JS)
        run: npm run build

      - name: Run test suite with coverage
        run: npm test

      - name: Verify package packaging (npm pack dry-run)
        run: npm pack --dry-run

      - name: Clean project installation and import verification (Plain HTML, React, Vue, Svelte, Solid, Paper)
        run: |
          TARBALL=$(npm pack)
          mkdir -p /tmp/smoke-test
          cd /tmp/smoke-test
          npm init -y
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          node -e "
            const boodoo = require('boodoo');
            console.log('CJS Root export verified:', typeof boodoo.Modal === 'function');
            import('boodoo').then(esm => {
              console.log('ESM Root export verified:', typeof esm.Modal === 'function');
            });
            const tokens = require('boodoo/tokens');
            console.log('Tokens export verified:', Boolean(tokens.colors && tokens.colors.primary));
            import('boodoo/paper').then(paper => {
              console.log('Paper theme export verified:', Boolean(paper.boodooPaperLightTheme));
            });
            import('boodoo/svelte').then(s => {
              console.log('Svelte export verified:', typeof s.disclosure === 'function');
            });
            import('boodoo/solid').then(sol => {
              console.log('Solid export verified:', typeof sol.createDisclosure === 'function');
            });
          "
          # Verify optional peer integration wrappers when peer libraries are present
          npm install react react-dom vue typescript @types/react @types/react-dom
          node -e "
            import('boodoo/react').then(r => {
              console.log('React hooks export verified:', typeof r.useDisclosure === 'function');
            });
            import('boodoo/vue').then(v => {
              console.log('Vue composables export verified:', typeof v.useDisclosure === 'function');
            });
          "
          # Verify consumer TypeScript compilation with installed definitions
          npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext << 'EOF'
          import { Modal, Toast } from 'boodoo';
          import { colors, spacing } from 'boodoo/tokens';
          import { useDisclosure as useReactDisclosure } from 'boodoo/react';
          import { useDisclosure as useVueDisclosure } from 'boodoo/vue';
          import { disclosure as svelteDisclosure } from 'boodoo/svelte';
          import { createDisclosure as solidDisclosure } from 'boodoo/solid';
          import { boodooPaperLightTheme } from 'boodoo/paper';

          const primaryColor: string = colors.primary;
          const openState: boolean = false;
          EOF
          echo "Consumer TypeScript compilation check passed!"
