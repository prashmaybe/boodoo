name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Sass (build tool)
        run: npm install -g sass

      - name: Build framework (CSS + JS)
        run: npm run build

      - name: Run test suite with coverage
        run: npm test

      - name: Verify package packaging (npm pack dry-run)
        run: npm pack --dry-run

      - name: Clean project installation and import verification (Plain HTML, React, Vue)
        run: |
          TARBALL=$(npm pack)
          mkdir -p /tmp/smoke-test
          cd /tmp/smoke-test
          npm init -y
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          node -e "
            const boodoo = require('boodoo');
            console.log('CJS Root export verified:', typeof boodoo.Modal === 'function');
            import('boodoo').then(esm => {
              console.log('ESM Root export verified:', typeof esm.Modal === 'function');
            });
            const tokens = require('boodoo/tokens');
            console.log('Tokens export verified:', Boolean(tokens.colors && tokens.colors.primary));
            import('boodoo/react').then(r => {
              console.log('React hooks export verified:', typeof r.useDisclosure === 'function');
            });
            import('boodoo/vue').then(v => {
              console.log('Vue composables export verified:', typeof v.useDisclosure === 'function');
            });
          "
