name: AI Documentation & Specification Check

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  validate-ai-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate AI documentation and MCP server
        run: node --test tests/ai-docs-validation.test.mjs

      - name: Run AI compatibility evaluation benchmarks
        run: node --test tests/ai-benchmark.test.mjs

