<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Combobox</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/boodoo@1.3.1/dist/css/boodoo.min.css"
    />
  </head>
  <body>
    <div class="container py-5">
      <div class="combobox">
        <input
          type="text"
          class="form-control combobox-input"
          id="searchCombo"
          name="searchCombo"
          placeholder="Search..."
        />
      </div>
    </div>
  </body>
</html>
