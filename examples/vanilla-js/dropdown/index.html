<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boodoo Dropdown Example</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/boodoo@1.3.1/dist/css/boodoo.min.css"
    />
  </head>
  <body>
    <div class="container py-5">
      <div class="dropdown">
        <button
          type="button"
          class="btn btn-primary dropdown-toggle"
          id="dropdownMenuButton"
          data-boodoo-toggle="dropdown"
          aria-expanded="false"
        >
          <span>Options Menu</span>
        </button>
        <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
          <li>
            <a class="dropdown-item" href="#"><span>Action</span></a>
          </li>
          <li>
            <a class="dropdown-item" href="#"><span>Another action</span></a>
          </li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <a class="dropdown-item" href="#"><span>Separated link</span></a>
          </li>
        </ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/boodoo@1.3.1/dist/js/boodoo.min.js"></script>
  </body>
</html>
