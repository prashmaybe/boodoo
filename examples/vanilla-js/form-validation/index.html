<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boodoo Form Validation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boodoo@1.3.0/dist/css/boodoo.min.css">
</head>
<body>
  <div class="container py-5">
    <form class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="userEmail" class="form-label"><span>Email address</span></label>
        <input type="email" class="form-control" id="userEmail" name="userEmail" placeholder="name@example.com" required>
        <div class="invalid-feedback"><span>Please provide a valid email.</span></div>
      </div>
      <div class="mb-3">
        <label for="userRole" class="form-label"><span>Role</span></label>
        <select class="form-select" id="userRole" name="userRole" required>
          <option value="">Choose...</option>
          <option value="dev">Developer</option>
          <option value="des">Designer</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary"><span>Submit</span></button>
    </form>
  </div>
</body>
</html>
