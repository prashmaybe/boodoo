<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boodoo Modal Example</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/boodoo@1.3.1/dist/css/boodoo.min.css"
    />
  </head>
  <body>
    <div class="container py-5">
      <button type="button" class="btn btn-primary" id="openModalBtn">
        <span>Open Modal</span>
      </button>

      <div
        class="modal fade"
        id="exampleModal"
        tabindex="-1"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitle"><span>Accessible Modal</span></h5>
              <button
                type="button"
                class="btn-close"
                data-boodoo-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <p>
                <span>This is a clean, accessible modal built with Boodoo vanilla JavaScript.</span>
              </p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-boodoo-dismiss="modal">
                <span>Cancel</span>
              </button>
              <button type="button" class="btn btn-primary"><span>Save changes</span></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/boodoo@1.3.1/dist/js/boodoo.min.js"></script>
    <script>
      const modalEl = document.getElementById('exampleModal');
      const modal = boodoo.Modal.getOrCreateInstance(modalEl);
      document.getElementById('openModalBtn').addEventListener('click', () => modal.show());
    </script>
  </body>
</html>
