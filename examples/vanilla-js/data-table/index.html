<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Data Table</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/boodoo@1.3.0/dist/css/boodoo.min.css"
    />
  </head>
  <body>
    <div class="table-responsive">
      <table class="table data-table table-hover">
        <thead>
          <tr>
            <th><span>ID</span></th>
            <th><span>Name</span></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span>1</span></td>
            <td><span>Example</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
