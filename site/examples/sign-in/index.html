<!doctype html>
<html lang="en" data-boodoo-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Minimal, centered sign in authentication template built with boodoo.">
  <title>boodoo · Sign-in Example</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/brand/boodoo-icon.svg">
  <link rel="stylesheet" href="../../dist/css/boodoo.min.css">
  <link rel="stylesheet" href="../../assets/docs.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 10%, rgba(124, 58, 237, 0.15) 0%, rgba(248, 250, 252, 1) 60%);
    }
    .form-signin {
      width: 100%;
      max-width: 380px;
      padding: 1.5rem;
      margin: auto;
    }
  </style>
</head>

<body>
  <main class="form-signin text-center">
    <form class="card p-4 p-sm-5 shadow-lg border-0 rounded-4">
      <div class="mb-4">
        <a href="../index.html">
          <img class="mb-2" src="../../assets/brand/boodoo-icon.svg" alt="boodoo" width="56" height="56">
        </a>
        <h1 class="h3 mb-2 fw-bold text-gradient">Welcome back</h1>
        <p class="text-muted small mb-0">Please sign in to your boodoo account</p>
      </div>

      <div class="form-floating mb-3 text-start">
        <input type="email" class="form-control rounded-3" id="floatingInput" name="floatingInput" placeholder="name@example.com" required>
        <label for="floatingInput">Email address</label>
      </div>
      <div class="form-floating mb-3 text-start">
        <input type="password" class="form-control rounded-3" id="floatingPassword" name="floatingPassword" placeholder="Password" required>
        <label for="floatingPassword">Password</label>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4 text-start">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="remember-me" id="rememberMe" name="rememberMe">
          <label class="form-check-label small" for="rememberMe">Remember me</label>
        </div>
        <a href="#" class="small text-primary text-decoration-none">Forgot?</a>
      </div>

      <button class="w-100 btn btn-lg btn-primary rounded-pill shadow-sm mb-3" type="submit">Sign in</button>
      
      <p class="text-muted small mb-3"><span>Don't have an account? </span><a href="#" class="text-primary text-decoration-none">Create one</a></p>
      
      <hr class="my-3">
      
      <a href="../index.html" class="small text-muted text-decoration-none">← Back to All Examples</a>
      
      <p class="mt-4 mb-0 text-muted small"><span>© 2026 boodoo Framework</span></p>
    </form>
  </main>

  <script src="../../dist/js/boodoo.js"></script>
</body>
</html>
