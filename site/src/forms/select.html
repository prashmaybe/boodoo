<h1>Select</h1>
<p class="lead">Customize the native <code>&lt;select&gt;</code>s with custom CSS that changes the element's initial appearance.</p>

<h2 id="default">Default</h2>
<div class="bd-example">
  <select class="form-select" aria-label="Default select example">
    <option selected>Open this select menu</option>
    <option value="1">One</option>
    <option value="2">Two</option>
    <option value="3">Three</option>
  </select>
</div>

<h2 id="sizing">Sizing</h2>
<p>You may also choose from small and large custom selects to match our similarly sized text inputs.</p>
<div class="bd-example">
  <select class="form-select form-select-lg mb-3" aria-label="Large select example">
    <option selected>Large select</option>
    <option value="1">One</option>
    <option value="2">Two</option>
  </select>
  <select class="form-select form-select-sm" aria-label="Small select example">
    <option selected>Small select</option>
    <option value="1">One</option>
    <option value="2">Two</option>
  </select>
</div>

<h2 id="multiple">Multiple select</h2>
<div class="bd-example">
  <select class="form-select" multiple aria-label="Multiple select example" size="3">
    <option selected>Open this select menu</option>
    <option value="1">One</option>
    <option value="2">Two</option>
    <option value="3">Three</option>
  </select>
</div>

<h2 id="disabled">Disabled</h2>
<div class="bd-example">
  <select class="form-select" aria-label="Disabled select example" disabled>
    <option selected>Open this select menu</option>
    <option value="1">One</option>
  </select>
</div>
