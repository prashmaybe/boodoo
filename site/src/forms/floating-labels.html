<h1>Floating labels</h1>
<p class="lead">Create Material-inspired floating labels for text and select inputs by adding the <code>.form-floating</code> wrapper.</p>

<h2 id="basic">Basic example</h2>
<div class="bd-example">
  <div class="form-floating w-75 mb-3">
    <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
    <label for="floatingInput">Email address</label>
  </div>
  <div class="form-floating w-75">
    <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
    <label for="floatingPassword">Password</label>
  </div>
</div>

<h2 id="textareas">Textareas</h2>
<div class="bd-example">
  <div class="form-floating w-75">
    <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
    <label for="floatingTextarea">Comments</label>
  </div>
</div>

<h2 id="selects">Selects</h2>
<div class="bd-example">
  <div class="form-floating w-75">
    <select class="form-select" id="floatingSelect" aria-label="Floating label select example">
      <option selected>Open this select menu</option>
      <option value="1">One</option>
      <option value="2">Two</option>
    </select>
    <label for="floatingSelect">Works with selects</label>
  </div>
</div>

<h2 id="validation">Validation</h2>
<div class="bd-example">
  <div class="form-floating w-75">
    <input type="email" class="form-control is-invalid" id="floatingInputInvalid" placeholder="name@example.com" value="not an email">
    <label for="floatingInputInvalid">Invalid input</label>
    <div class="invalid-feedback"><span>Please choose a valid email.</span></div>
  </div>
</div>
