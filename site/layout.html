<!doctype html>
<html lang="en" data-boodoo-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#7c3aed">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="boodoo">
  <meta property="og:title" content="{{docstitle}} · boodoo">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{rootPrefix}}assets/brand/boodoo-og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>{{title}} · boodoo</title>
  <link rel="icon" type="image/svg+xml" href="{{rootPrefix}}assets/brand/boodoo-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="{{rootPrefix}}assets/brand/boodoo-icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{rootPrefix}}assets/brand/boodoo-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="{{rootPrefix}}assets/brand/boodoo-icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{rootPrefix}}assets/brand/boodoo-icon-180.png">
  <link rel="manifest" href="{{rootPrefix}}site.webmanifest">
  <meta name="msapplication-TileColor" content="#7c3aed">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{rootPrefix}}dist/css/boodoo.min.css">
  <link rel="stylesheet" href="{{rootPrefix}}assets/docs.css">
</head>

<body>
  <a class="visually-hidden-focusable" href="#docs-content">Skip to main content</a>

  <nav
    class="navbar navbar-expand-lg navbar-light bg-white shadow-sm navbar-docs position-sticky sticky-top top-0 z-30">
    <div class="d-flex container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{{rootPrefix}}index.html">
        <img src="{{rootPrefix}}assets/brand/boodoo-icon.svg" alt="boodoo Framework" height="32" loading="lazy">
        <span class="fw-bold fs-5 text-gradient">boodoo</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-boodoo-toggle="collapse" data-boodoo-target="#docsNav"
        aria-controls="docsNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="docsNav">
        <ul class="navbar-nav ms-auto me-auto mb-2 mb-lg-0 fw-medium">
          <li class="nav-item"><a class="nav-link" href="{{rootPrefix}}index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{rootPrefix}}index.html#features">Features</a></li>
          <li class="nav-item"><a class="nav-link" href="{{rootPrefix}}index.html#components">Components</a></li>
          <li class="nav-item"><a class="nav-link" href="{{rootPrefix}}index.html#installation">Installation</a></li>
          <li class="nav-item"><a class="nav-link" href="{{rootPrefix}}index.html#inspiration">Inspiration</a></li>
          <li class="nav-item"><a class="nav-link active"
              href="{{rootPrefix}}docs/getting-started/introduction.html">Docs</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <button class="theme-toggle-btn" id="themeToggle" type="button" aria-label="Toggle light and dark mode"
            title="Toggle theme">
            <span class="theme-icon">🌙</span>
          </button>
          <a class="btn btn-outline-primary btn-sm rounded-pill px-3 d-none d-sm-inline-flex"
            href="{{rootPrefix}}docs/getting-started/usage.html">CDN</a>
          <a class="btn btn-primary btn-sm rounded-pill px-3"
            href="{{rootPrefix}}docs/getting-started/download.html">Download</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid container-xl">
    <div class="row">
      <aside class="col-lg-3 col-xl-2">
        <div class="docs-sidebar">
          <nav aria-label="Docs navigation">
            {{sidebar}}
          </nav>
        </div>
      </aside>

      <main class="col-lg-6 col-xl-7">
        <div class="docs-main py-1" id="docs-content">
          {{breadcrumb}}
          {{content}}
          {{prevnext}}

        </div>
      </main>

      <aside class="col-lg-3 col-xl-3">
        {{toc}}
      </aside>
    </div>
  </div>

  <!-- Footer spanning the whole page -->
  <footer class="py-1 border-top">
    <div
      class="container d-flex flex-column flex-md-row gap-3 justify-content-between align-items-center text-muted small">
      <div class="d-inline-flex gap-2">
        <img src="{{rootPrefix}}assets/brand/boodoo-icon.svg" alt="boodoo" height="24" width="24" loading="lazy">
        <span>© {{year}} Pebble Benders · MIT License</span>
      </div>
      <div class="d-flex gap-3">
        <a class="text-muted text-decoration-none"
          href="{{rootPrefix}}docs/getting-started/introduction.html">Documentation</a>
        <span>·</span>
        <a class="text-muted text-decoration-none" href="{{rootPrefix}}docs/getting-started/download.html">Download</a>
        <span>·</span>
        <a class="text-muted text-decoration-none" href="{{rootPrefix}}docs/about/license.html">License</a>
      </div>
    </div>
  </footer>

  <script src="{{rootPrefix}}dist/js/boodoo.js"></script>
  <script>
    // Theme toggle logic
    (function () {
      var storedTheme = localStorage.getItem('boodoo-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-boodoo-theme', storedTheme);
      var toggleBtn = document.getElementById('themeToggle');
      function updateIcon(theme) {
        if (toggleBtn) {
          toggleBtn.querySelector('.theme-icon').textContent = theme === 'dark' ? '☀️' : '🌙';
        }
      }
      updateIcon(storedTheme);
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-boodoo-theme');
          var next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-boodoo-theme', next);
          localStorage.setItem('boodoo-theme', next);
          updateIcon(next);
        });
      }
    })();

    // Copy-to-clipboard for code blocks
    document.querySelectorAll('.highlight pre').forEach(function (pre) {
      var btn = document.createElement('button');
      btn.className = 'btn btn-sm btn-soft-primary highlight-copy';
      btn.textContent = 'Copy';
      btn.type = 'button';
      var container = pre.closest('.highlight') || pre.parentElement;
      if (container) container.appendChild(btn);
      btn.addEventListener('click', function () {
        var text = pre.innerText;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(function () {
            btn.textContent = 'Copied!';
            setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
          });
        }
      });
    });
  </script>
</body>

</html>
